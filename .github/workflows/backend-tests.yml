name: Backend tests
on:
  push:
    paths: ['api/**','worker/**','scripts/**','tests/**','requirements.txt','Dockerfile','.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['api/**','worker/**','scripts/**','tests/**','requirements.txt','Dockerfile','.github/workflows/backend-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Create isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Compile
        run: .venv/bin/python -m compileall -q api worker scripts tests
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Build processing container
        run: docker build --pull -t circuitvortex-pcb-lab:ci .
      - name: Container smoke test
        run: |
          docker run -d --name cvx-ci -p 18000:8000 circuitvortex-pcb-lab:ci
          trap 'docker logs cvx-ci || true; docker rm -f cvx-ci || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18000/health && exit 0; sleep 2; done
          exit 1
