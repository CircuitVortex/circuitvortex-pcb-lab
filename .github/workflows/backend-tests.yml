name: Backend tests
on:
  push:
    paths: ['api/**','worker/**','scripts/**','tests/**','requirements.txt','Dockerfile']
  pull_request:
    paths: ['api/**','worker/**','scripts/**','tests/**','requirements.txt','Dockerfile']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q api worker scripts
      - run: pytest -q
