name: Full PCB Pipeline
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: mkdir -p reports
      - run: python scripts/inspect_pcb.py pcb/examples/example.kicad_pcb -o reports/inspection.json
      - run: python scripts/dfm_check.py pcb/examples/example.kicad_pcb -o reports/dfm.json
      - run: python scripts/generate_summary.py --inspect reports/inspection.json --dfm reports/dfm.json
      - uses: actions/upload-artifact@v4
        with: {name: pcb-pipeline, path: reports/}
