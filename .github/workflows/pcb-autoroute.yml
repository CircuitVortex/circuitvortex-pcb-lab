name: PCB Autoroute

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pcb/**'
      - 'scripts/**'
      - 'autoroute/**'
      - 'freerouting/**'
      - '.github/workflows/pcb-autoroute.yml'

permissions:
  contents: read

jobs:
  autoroute:
    runs-on: ubuntu-latest

    container:
      image: kicad/kicad:10.0.5
      options: --user 0

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl \
            unzip \
            ca-certificates \
            xvfb \
            xauth \
            default-jre-headless
          rm -rf /var/lib/apt/lists/*

      - name: Verify KiCad Python API
        timeout-minutes: 3
        run: |
          echo "Python:"
          python3 --version
          echo "KiCad CLI:"
          kicad-cli --version
          echo "Testing pcbnew import:"
          timeout 60s xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 -c "import pcbnew; print('pcbnew:', pcbnew.__file__)"
          echo "KiCad Python API OK"

      - name: Compile project Python
        run: |
          python3 -m compileall -q api worker scripts tests

      - name: Prepare autoroute input
        run: |
          mkdir -p /tmp/autoroute
          cp pcb/examples/example.kicad_pcb /tmp/autoroute/input.kicad_pcb

      - name: Export Specctra DSN
        run: |
          timeout 240s xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 scripts/export_dsn.py \
              /tmp/autoroute/input.kicad_pcb \
              /tmp/autoroute/input.dsn
          test -s /tmp/autoroute/input.dsn


      - name: Verify Java
        run: |
          java -version

      - name: Download FreeRouting
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/freerouting.jar \
            https://github.com/freerouting/freerouting/releases/download/v2.2.4/freerouting-2.2.4.jar
          test -s /tmp/freerouting.jar

      - name: Run FreeRouting
        run: |
          java -jar /tmp/freerouting.jar \
            -de /tmp/autoroute/input.dsn \
            -do /tmp/autoroute/routed.ses \
            -inc GND \
            -mp 500
          test -s /tmp/autoroute/routed.ses

      - name: Import routed SES
        run: |
          timeout 240s xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 scripts/import_ses.py \
              /tmp/autoroute/input.kicad_pcb \
              /tmp/autoroute/routed.ses \
              /tmp/autoroute/autorouted.kicad_pcb
          test -s /tmp/autoroute/autorouted.kicad_pcb

      - name: Run final DRC
        run: |
          mkdir -p /tmp/autoroute/drc
          kicad-cli pcb drc \
            --exit-code-violations \
            -o /tmp/autoroute/drc/drc.txt \
            /tmp/autoroute/autorouted.kicad_pcb || true
          cat /tmp/autoroute/drc/drc.txt

      - name: Upload autoroute results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb-autoroute-results
          path: /tmp/autoroute/
