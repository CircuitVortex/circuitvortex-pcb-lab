name: PCB DFM
on: {workflow_dispatch: {}, push: {paths: ['pcb/**/*.kicad_pcb','scripts/**','dfm/**']}}
permissions: {contents: read}
jobs:
  dfm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/dfm_check.py pcb/examples/example.kicad_pcb -o reports/dfm.json
      - uses: actions/upload-artifact@v4
        with: {name: pcb-dfm, path: reports/dfm.json}
