name: PCB Safe Fix
on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: string
permissions: {contents: read}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/safe_edit.py "${{ inputs.operation }}" pcb/examples/example.kicad_pcb
