name: PCB Inspect
on: {workflow_dispatch: {}, push: {paths: ['pcb/**/*.kicad_pcb','scripts/**']}}
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/inspect_pcb.py pcb/examples/example.kicad_pcb -o reports/inspection.json
      - uses: actions/upload-artifact@v4
        with: {name: pcb-inspection, path: reports/inspection.json}
